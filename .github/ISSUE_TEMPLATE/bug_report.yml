name: Bug report
description: Something in the app behaves differently from what it says it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please do not paste your `journal.json`, an
        export, or a screenshot of your own entries — they are a diary. A
        trimmed-down file with one or two invented days reproduces almost
        anything, and `/app?demo=1` is filled with invented days already.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Describe the shape of the problem, not what you wrote.
      placeholder: |
        I saved an entry at 23:30 and it landed on the next day.
        I expected it to land on the day I was writing about.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered, starting from a fresh journal or from `/app?demo=1` where possible.
      placeholder: |
        1. Open /app?demo=1
        2. Settings, set the week to start on Sunday
        3. Open the month
        4. The first row is offset by one column
    validations:
      required: true

  - type: dropdown
    id: view
    attributes:
      label: Where
      description: Which part of the app. Pick more than one if it applies everywhere.
      multiple: true
      options:
        - The year
        - The month grid
        - The day
        - Writing or editing a day
        - The summary
        - Settings
        - Import, export, export as text
        - Presentation site
        - Everywhere or not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 141 on Linux, Safari 26 on iOS
    validations:
      required: true

  - type: input
    id: screen
    attributes:
      label: Window width
      description: The layout changes at 640 px, so this narrows it down fast.
      placeholder: about 390 px, phone
    validations:
      required: false

  - type: input
    id: settings
    attributes:
      label: Relevant settings
      description: >
        Week starting Monday or Sunday, mood asked or not, short note asked or
        not, reading text size. Several bugs only show up on one combination.
      placeholder: week starts Sunday, mood hidden
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, at the bottom.
      placeholder: 0.1.0
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: This is a defect, not a missing feature.
          required: true
        - label: I have not included the contents of any real entry.
          required: true
