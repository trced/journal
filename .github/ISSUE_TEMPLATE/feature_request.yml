name: Feature request
description: Something journal. should do and does not.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        journal. answers a single question: **what was that day like?**
        Features that do not serve that question are refused on purpose,
        however good they are — evening reminders, mood averages and charts,
        writing prompts, question-of-the-day, tags, folders, rich text, photo
        attachments and automatic summaries have all been considered and
        turned down.

        Two of those are settled. **The evening reminder**: an app that
        demands its entry turns a journal into homework, and the day you write
        for the reminder rather than the wish, what you wrote is worth nothing.
        **Automatic analysis**: no summary, no sentiment score, no "insights" —
        what you write does not have to be read by a program, and there is no
        server to send it to. Those two are not up for rediscussion.

        Everything else is. That is a reason to answer the third field
        carefully, not a reason to stay quiet.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way. Not the solution yet.
      placeholder: |
        I write about the same few people and I cannot find the days they
        appear in without reading a whole month.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: Be concrete. A sentence describing the screen is worth more than a feature name.
    validations:
      required: true

  - type: textarea
    id: fit
    attributes:
      label: How does this serve "what was that day like?"
      description: >
        The filter every feature goes through. If the answer is that it would
        motivate you, score you, remind you, or read your entries on your
        behalf, this is probably not the project for it — and that is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing settings, the summary, the plain-text export and your editor's own search. What was missing.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read "What it is not" in the README.
          required: true
        - label: This works without an account, a server, or a network request.
          required: true
        - label: This adds no reminder, score, average or reward.
          required: true
        - label: This does not have a program read what I wrote.
          required: true
